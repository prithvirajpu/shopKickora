services:

  web:
    build: .
    container_name: shopkickora

    command: gunicorn shopkickora.wsgi:application --bind 0.0.0.0:8000 --workers 3

    env_file:
      - .env

    volumes:
      - static_volume:/app/staticfiles

    expose:
      - "8000"

  nginx:
    image: nginx:latest
    container_name: shopkickora_nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles

    depends_on:
      - web

volumes:
  static_volume: